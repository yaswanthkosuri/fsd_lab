<!DOCTYPE html>
<html>
<head>
    <title>Internal and External JavaScript</title>

  
    <script src="script.js"></script>
</head>

<body>

    <h1>JavaScript Example</h1>

   
    <button onclick="internalFunction()">
        Internal JavaScript
    </button>

    <button onclick="externalFunction()">
        External JavaScript
    </button>

    <script>
        
        function internalFunction() {
            alert("This is Internal JavaScript!");
        }
    </script>

</body>
</html>
