<!DOCTYPE html>
<html>
<head>
    <title>Font and Text Properties</title>

    <style>

        .size {
            font-size: 30px;
        }

        .weight {
            font-weight: bold;
        }

       
        .style {
            font-style: italic;
        }

        
        .decoration {
            text-decoration: underline;
        }

        .transform {
            text-transform: uppercase;
        }

        .alignment {
            text-align: center;
        }

    </style>
</head>

<body>

    <h1>CSS Font and Text Properties</h1>

    <p class="size">
        This text uses font-size.
    </p>

    <p class="weight">
        This text uses font-weight.
    </p>

    <p class="style">
        This text uses font-style.
    </p>

    <p class="decoration">
        This text uses text-decoration.
    </p>

    <p class="transform">
        this text uses text-transform.
    </p>

    <p class="alignment">
        This text uses text-align.
    </p>

</body>
</html>
