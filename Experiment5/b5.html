<!DOCTYPE html>
<html>
<head>
    <title>Fixed Background Image</title>

    <style>
        body {
            height: 1200px;

            
            background-image: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");

            background-position: center 50%;

           
            background-attachment: fixed;

            background-size: cover;

            background-repeat: no-repeat;
        }

        h1 {
            text-align: center;
            margin-top: 500px;
            color: white;
        }

        p {
            text-align: center;
            color: white;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Background Image Example</h1>

    <p>Scroll the page. The background image remains fixed.</p>

</body>
</html>
