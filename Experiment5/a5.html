<!DOCTYPE html>
<html>
<head>
    <title>Different Ways to Apply Colors in CSS</title>

    <style>

       
        .name {
            color: red;
        }

        .hex {
            color: #0000FF;
        }

      
        .rgb {
            color: rgb(0, 128, 0);
        }

        .rgba {
            color: rgba(255, 0, 0, 0.5);
        }

       
        .hsl {
            color: hsl(240, 100%, 50%);
        }

      
        .hsla {
            color: hsla(120, 100%, 25%, 0.7);
        }

    </style>
</head>

<body>

    <h1>Different Ways to Reference Colors in CSS</h1>

    <p class="name">This uses Color Name: Red</p>

    <p class="hex">This uses HEX Color: #0000FF</p>

    <p class="rgb">This uses RGB Color: rgb(0, 128, 0)</p>

    <p class="rgba">This uses RGBA Color: rgba(255, 0, 0, 0.5)</p>

    <p class="hsl">This uses HSL Color: hsl(240, 100%, 50%)</p>

    <p class="hsla">This uses HSLA Color: hsla(120, 100%, 25%, 0.7)</p>

</body>
</html>
