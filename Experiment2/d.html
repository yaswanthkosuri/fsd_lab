<!DOCTYPE html>
<html>
<head>
    <title>Three Sections</title>
</head>

<body>

    <table border="1" width="100%" height="600">
        <tr>
            <td align="center">
                <h2>Image</h2>

                <img src="https://www.w3schools.com/html/img_girl.jpg"
                     width="250"
                     height="150"
                     alt="Sample Image">
            </td>
        </tr>

        <tr>
            <td align="center">
                <h2>Paragraph</h2>

                <p>
                    HTML stands for HyperText Markup Language.
                    It is used to create and structure web pages.
                </p>
            </td>
        </tr>

        <tr>
            <td align="center">
                <h2>Hyperlink</h2>

                <a href="https://www.google.com" target="_blank">
                    Open Google
                </a>
            </td>
        </tr>

    </table>

</body>
</html>
