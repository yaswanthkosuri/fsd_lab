<!DOCTYPE html>
<html>
<head>
    <title>Types of CSS</title>

    <style>
        h2 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 18px;
        }
    </style>

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 style="color: red; text-align: center;">
        Inline CSS
    </h1>

    <h2>Internal CSS</h2>

    <p>
        This paragraph uses internal CSS.
    </p>

    <div class="external">
        This text uses external CSS.
    </div>

</body>
</html>
